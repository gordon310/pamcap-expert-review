<script id="survey-spec" type="application/json">{"id":"pamcap-hotel-valuation-review","version":"1.1","date":"2026-10-10","title":"酒店资产估值 · 专家确认问卷","groups":[["A","项目与投入","明确评估对象、项目范围和真实投入。"],["B","财务与数据","统一 USALI、报表版本和实际经营数据。"],["C","收益与参数","复核储备前口径、地段调整及参数依据。"],["D","估值方法","分别定义各方法的数据、现金流与价值对象。"],["E","回报与偿债","复核 IRR 和 DSCR，避免简化指标误命名。"],["F","报告与专业复核","确认报告表达、资料缺失处理和专业复核要求。"]],"references":[["USALI 第12版发布与采用日期（AHLA）","https://www.ahla.com/news/hftp-ahla-and-gfc-unveil-groundbreaking-12th-revised-edition-uniform-system-accounts-lodging"],["STR 历史经营对标数据报告规则","https://www.costar.com/products/str-benchmark/resources/guidelines/historical-benchmarking-data-reporting-guidelines"],["HVS 储备前后资本化率示例（2020，非当前参数）","https://www.hvs.com/Print/Hotel-Values-Moderate-Cap-Rates-Stable?id=8679"],["HVS 酒店估值方法说明（2022）","https://publications.hvs.com/article/9423-HVS-Monday-Musings-Income-Capitalization-Approach-The-Gold-Standard-for-Valuing-Hotels"],["Microsoft XIRR 定义","https://support.microsoft.com/zh-cn/excel/functions/xirr-function"],["OCC 物业偿债分析（历史方法资料）","https://www.occ.treas.gov/static/ots/exam-handbook/ots-exam-handbook-210aa.pdf"]],"questions":[{"id":"A01","group":"A","title":"首期酒店项目范围","status":"业务已确认","ref":"Q41、Q51-Q52","baseline":"首期评估已经存在、业主自有物业的酒店，支持自营、委托管理和特许经营。暂不提供租赁物业经营酒店的业务；“新建酒店”是从平地建成的既有酒店，不指未建开发项目。","definitions":[["自有物业与管理关系","产权归属和经营管理方式是不同维度。委托管理或品牌加盟不等同于承租物业；发生的管理费、品牌费仍需按 USALI 归类。"],["排除租赁项目","当前表单及模型不以租赁物业经营为业务对象，不意味着把实际存在的租赁项目改标为自有项目。"]],"focus":"这一范围能否清晰筛选项目？是否存在混合产权、部分楼层租赁等需要先排除或另行定义的边界？","example":"","choices":[],"requireSource":false,"formula":null,"requiresDetail":false},{"id":"A02","group":"A","title":"各方法评估的价值对象","status":"专业待确认","ref":"PDF E04","baseline":"建议各方法分别注明评估对象、权利范围、基准日、币种及资产包含范围，不把企业价值、物业资产价值和股权价值直接当成同一数值。","definitions":[["企业价值 EV","面向企业经营资产的价值概念；具体包含项及与净债务的桥接应明确，不能简单等同某一酒店物业价格。"],["股权价值","属于股东权益的价值，通常需要从企业价值出发结合净债务及其他非经营项目调整，具体桥接由专家核定。"],["酒店资产范围","土地、建筑物、设备、营运资金、品牌或其他经营权益是否包含，应随方法明确列示。"]],"focus":"请建议首期如何表达并列结果。若主张统一到同一对象，请写出桥接所需资料及计算方法。","example":"","choices":[["separate","分别标明各方法的价值对象","保持各法独立，不强行换算为同一价值。"],["bridge","桥接到明确的同一对象后并列","须说明目标对象和桥接规则，仍不加权合成。"],["other","其他处理","请在意见中定义。"]],"requireSource":false,"formula":["建议桥接，需确认包含范围",["股权价值 = EV − 有息债务 + 可加回现金 + 其他净调整"],"EV 为经营企业价值；现金须区分受限和经营必需部分；其他净调整按正负号逐项列示。金额使用同币种、同基准日。此式不等于酒店物业价值公式。"],"requiresDetail":true},{"id":"A03","group":"A","title":"建筑面积与土地面积","status":"业务已确认","ref":"Q39","baseline":"估值采集的建筑面积采用不含地下室口径。土地面积单独取数；旧文档以建筑面积代替缺失土地面积的做法需要纠正。","definitions":[["建筑面积","本次面积口径排除地下室；对标或比较案例采用不同口径时，需要可追溯转换。"],["土地面积","项目用地面积，与建筑面积不是同一概念，不能直接互代。"]],"focus":"请说明面积的优先来源、单位、与可比案例的转换要求，以及土地面积缺失时哪些方法应暂停。","example":"","choices":[],"requireSource":false,"formula":["已确认的采集口径",["采集建筑面积 = 同范围地上及地下总建筑面积 − 地下室建筑面积"],"单位：平方米。仅在总面积包含地下室且测量范围一致时可作减法；土地面积单独采集。"],"requiresDetail":false},{"id":"A04","group":"A","title":"真实投入与资金来源","status":"业务已确认","ref":"Q43-Q45、Q53","baseline":"项目总投入按同一项目范围、同一截止日，以自有资金投入加贷款投入核对。包括已发生的土地取得、建设或收购、装修、设备等，保留分项及追加投入日期。偿还贷款不减少历史投入；未用授信和重复融资不重复增加投入。","definitions":[["资金来源与支出用途","是同一投入的两个核对维度，不把两者再相加。应区分已用于项目的资金和尚未使用的融资款。"],["历史投入与市场价值","历史投入记录实际发生金额；土地当前市场价值另存，不回写历史投入。"],["资本化边界","建设期利息、开办费、交易费用、重大翻新和日常维修的具体分类尚待专家核定。"]],"focus":"请明确哪些费用计入投入，以及如何与账面固定资产、项目现金流勾稽。","example":"总投入 1 亿元已含土地成本 2,000 万元，总投入仍为 1 亿元。","choices":[],"requireSource":false,"formula":["已确认原则，成本边界待核定",["项目总投入 = 累计已用于项目的自有资金 + 累计已用于项目的贷款资金","项目总投入 = Σ 各项合资格实际投入（用于资金用途核对）"],"同项目、同截止日、同币种。来源与用途是两套勾稽视图，不相加；剔除未使用融资及再融资重复金额；贷款余额和已还本金不替代历史投入。"],"requiresDetail":false},{"id":"B01","group":"B","title":"USALI 第12版与 EBITDA 科目桥接","status":"标准待逐项核验","ref":"Q48-Q49 / PDF E01","baseline":"EBITDA 必须遵循 USALI 第12修订版。当前确认的是标准选择，完整科目映射尚未完成专业验证；不能沿用“NOI 减业主费用即 EBITDA”的旧链条。","definitions":[["EBITDA","息税折旧摊销前利润；在本平台须由适用的 USALI 科目与报表结构推导，不能只凭缩写任意决定费用归类。"],["费用桥接","需列明从营业收入、部门损益、未分配费用等到 EBITDA 的完整关系，包含管理费及非经营收支的准确处理。"],["R105 / ONOP","旧资料中的名称与含义不一致，请明确对应的财务指标；不能对应时建议停用。"]],"focus":"若确认可执行，请填写所依据的第12版条款/页码、映射表或附件名称；未核对完整标准时请选“需补充依据”，避免将旧版 FAQ 视为第12版符合性证明。","example":"","choices":[["map","提供第12版科目对应关系并统一指标名称","需提供科目、公式及条款依据。"],["retire","保留标准指标，停用无法明确映射的旧指标","需列明停用指标与替代方式。"],["other","其他处理","请说明具体定义。"]],"requireSource":true,"formula":["核对框架，非已验证的 USALI 第12版映射",["EBITDA（概念核对）= 净利润 + 所得税费用 + 净利息费用 + 折旧 + 摊销"],"仅供同一报表范围的概念核对，净利息费用按已计入净利润的净额处理，不能直接视为符合 USALI 第12版的科目计算式。请专家另附第12版“营业收入→部门利润→GOP→管理费及非经营收支→EBITDA”的逐项科目桥接、正负号与条文；未核验不定版。FF&E 储备单列。"],"requiresDetail":true},{"id":"B02","group":"B","title":"年报与月报冲突","status":"业务已确认","ref":"Q46","baseline":"年度正式视图以有效年报为准，保留月报；年报与 12 个月合计的差异单独呈现，不自动回摊。月报修改新建版本，已出具报告保留当时采用的原始资料。","definitions":[["有效年报","经约定流程接收并标识的年度报表。是否审计、是否最终结账应以报表说明区分，不默认所有年报均已审计。"],["年末调整","年度与月度合计差异需要来源与解释，不能随意分摊到各月制造精度。"]],"focus":"请建议报表的有效状态、审计标识、修订优先级和可接受差异检查规则。","example":"","choices":[],"requireSource":false,"formula":["年度差异核对",["年报与月报差异 = 有效年报金额 − Σ（1 至 12 月有效月报金额）"],"同科目、同年度、同税费和币种口径；差异单列，不自动回摊。"],"requiresDetail":false},{"id":"B03","group":"B","title":"行业对标的可比口径","status":"业务已确认","ref":"Q47","baseline":"原始 P&L 完整保留；对标转换另存依据。税费及套餐非客房收入等需按适用规则拆分，缺乏依据时标记口径待补充，受影响指标暂不对标。","definitions":[["ADR / OCC / RevPAR","分别为平均房价、出租率和每间可售房收入，需统一客房收入、已售及可售房晚的定义，并明确赠房、停用房等处理。"],["套餐与服务费","套餐中的餐饮等部分需要适当归属；服务费、佣金、总额/净额不能仅根据名称统一扣减。"],["原始层与对标层","转换不覆盖原值，保存期间、金额和来源，以便回溯。"]],"focus":"请提供适用的计算口径和特殊场景处理；STR 是对标参考，不能替代全部 USALI 核验。","example":"","choices":[],"requireSource":false,"formula":["通用计算式，统计范围待核定",["ADR = 客房收入 ÷ 已售房晚","OCC = 已售房晚 ÷ 可售房晚 × 100%","RevPAR = 客房收入 ÷ 可售房晚 = ADR × OCC（小数）"],"ADR、RevPAR：元/房晚；OCC：百分比。收入按统一税费及套餐拆分口径；赠房、停用房等统计规则由专家确认。分母为零或缺失时不计算；跨月用分子分母合计后相除，不简单平均比率。"],"requiresDetail":false},{"id":"B04","group":"B","title":"实际经营数据与缺失数据","status":"业务已确认","ref":"Q40、Q50","baseline":"前期采集真实手工/标准模板数据，后续以有效同期间 P&L 为依据。实际报表与估值调整分开；不以携程均价乘折扣自动替代真实 ADR。","definitions":[["实际值","有明确期间和来源的酒店经营数据。零值代表实际为零，缺失代表未知，不能互代。"],["估值调整","为估值目的单列的有依据调整，记录理由、金额及期间，不更改原始 EBITDA。"]],"focus":"请列出一次性费用、停业装修、非经常收入等允许调整的条件及证明材料。","example":"","choices":[],"requireSource":false,"formula":["估值调整框架",["估值采用收益 = 原始 USALI EBITDA + Σ 经确认的有符号调整"],"正数为调增，负数为调减；每项调整记录期间、理由和凭据，原始报表不覆盖。"],"requiresDetail":false},{"id":"C01","group":"C","title":"FF&E 计提不直接扣减估值收益","status":"业务已确认，专业适用性待审","ref":"Q57 替代 Q56","baseline":"直接资本化采用“USALI EBITDA + 有依据的估值调整”的储备前收益，不直接扣 FF&E 更新储备计提；资本化率须同口径。USALI 报表仍保留适用的储备列报。","definitions":[["FF&E","家具、装置及设备。更新储备计提是为未来更新安排的金额，不等同当期已发生的设备采购现金支出。"],["储备前收益","本项目的估值输入标签；不是对 USALI EBITDA 的重新定义。若仍称 NOI，必须附明确口径。"],["口径匹配","使用储备前收益时，不可直接套用基于储备后收益形成的资本化率。"]],"focus":"请评审该口径在目标酒店市场是否可用、何时应限制使用，以及是否继续使用 NOI 名称。","example":"EBITDA 1,000 万元，无其他调整，计提 80 万元：本次直接资本化采用收益为 1,000 万元，而非 920 万元。","choices":[["label","使用“估值采用收益（储备前）”名称","避免与其他 NOI 定义混淆。"],["noi","继续使用 NOI，但显式标注储备前定义","需给出该名称适用的专业依据。"],["change","建议改变此估值口径","请说明理由，提交产品方重新确认，不自动覆盖业务决定。"]],"requireSource":false,"formula":["产品已确认原则，专业适用性待审",["Y = USALI EBITDA + Σ 经确认的估值调整","Vcap = Y ÷ R"],"Y 为年度储备前估值采用收益，单位元/年；R 为匹配的年度资本化率（5% 输入 0.05），Vcap 单位元。不直接扣 FF&E 储备计提；R 必须同为储备前口径。R 必须大于零，Y 非正须评审适用性，不直接输出常规资本化结果。示例：1,000 万元 ÷ 5% = 2 亿元，仅演示算式。"],"requiresDetail":true},{"id":"C02","group":"C","title":"真实更新支出进入现金流","status":"业务已确认","ref":"Q57","baseline":"DCF 与 IRR 不把储备计提直接当作现金支出；实际或预计装修、设备更新等支出按相应期间进入现金流，防止重复扣减。","definitions":[["资本性支出 CapEx","按模型定义纳入的更新、改造和设备等现金支出，需要区分维护性与扩张性项目及发生期间。"],["防重复","同一更新需求不能既按计提又按实际支出重复扣；也须核对期末价值是否已反映相关更新义务。"]],"focus":"请说明已知改造计划、长期必要更新、资料不足以及终值阶段更新需求的建模方式。","example":"","choices":[],"requireSource":false,"formula":["现金流扣减原则",["更新支出后的现金流 = 更新支出前现金流 − 当期实际或预计更新 CapEx"],"单位元/期。前项不得已含同一支出；不把储备计提再扣一次。DCF 和 IRR 仍须补齐税费、营运资金与其他现金流项。"],"requiresDetail":false},{"id":"C03","group":"C","title":"资本化率与地段系数","status":"业务已确认，参数待验证","ref":"Q58","baseline":"其他条件相同时，地段越好，估值越高。在地段越好、系数越大的定义下：资本化率 = 分类基准资本化率 ÷ 地段系数。","definitions":[["资本化率","把选定口径的年度收益转为价值的比率，应匹配收益、基准日、资产和市场范围。"],["地段系数","本项目用于调整资本化率的参数，尚无经专家确认的具体系数表。它不是可以直接引用为资本化率的土地价格指数。"],["重复调整","若分类基准已反映地区和地段差异，再修正可能重复计算。"]],"focus":"请说明除法模型适用性、校准样本、边界值及防重复调整方法。","example":"6% ÷ 1.2 = 5%，只演示方向，不代表推荐参数。","choices":[["division","保留除法模型，重新校准基准和系数","需提供校准依据和适用范围。"],["direct","建议由可比案例直接形成适用资本化率","可能替代地段系数，须说明与已定原则的衔接。"],["other","其他有依据的调整方式","请写明公式与验证方法。"]],"requireSource":false,"formula":["产品方向已确认，系数与适用性待审",["R = Rbase ÷ Klocation","Vcap = Y ÷ R = Y × Klocation ÷ Rbase"],"Rbase 为分类基准年度资本化率；Klocation 为无量纲且大于零的地段系数；其他条件一致时，系数越大、估值越高。示例：6% ÷ 1.2 = 5%。基准已含地段差异时避免重复调整，数值不作为推荐参数。"],"requiresDetail":true},{"id":"C04","group":"C","title":"估值参数的来源与适用范围","status":"业务已确认","ref":"Q58","baseline":"正式估值参数由螃蟹树聚统一提供；酒店集团提供实际经营资料与预算。请核对资本化率、贴现率和倍数的来源、有效日期及适用范围。","definitions":[["估值参数与酒店经营资料","贴现率、资本化率及倍数应有独立依据；实际报表、预算、改造计划应来自被评估酒店。"],["适用性","参数应标注来源、适用地区和酒店类型、收益口径、基准期及有效性。"]],"focus":"请建议参数复核周期、过期条件、样本不足时的处理，以及哪些预测假设需要单独审阅。","example":"","choices":[],"requireSource":false,"formula":null,"requiresDetail":false},{"id":"D01","group":"D","title":"DCF 现金流与价值对象","status":"专业待确认","ref":"Q50、Q57、Q62","baseline":"集团提交年度预算、经营预测和改造计划；计算规则与贴现率由螃蟹树聚维护。建议先固定现金流口径与估值对象，再选取匹配的贴现率。","definitions":[["DCF","折现现金流法，将各期现金流和期末价值折算到基准日。"],["项目与股权现金流","融资前项目现金流和扣除相关融资收支后的股权现金流并非同一序列；必须使用对应的折现口径。"],["税费与营运资金","税前/税后、营运资金变化及现金支出范围会影响结果，需要明确列项。"]],"focus":"请给出收入到自由现金流的桥接、税费和营运资金处理，以及匹配的贴现率定义。","example":"","choices":[["project","以项目/经营资产现金流为主","融资及股权回报另算，具体税前税后仍须注明。"],["both","项目与股权两套明确区分的 DCF","分别给出定义与折现率，不混用。"],["other","其他口径","请说明适用对象。"]],"requireSource":false,"formula":["建议采用的年末折现框架",["V0 = Σ[t=1…n] CFt ÷ (1+r)^t + TVnet,n ÷ (1+r)^n","FCFFt = EBITt × (1−Tt) + 折旧摊销t − CapExt − ΔNWCt","FCFEt = 净利润t + 折旧摊销t − CapExt − ΔNWCt + 新增借款t − 偿还本金t"],"金额单位元，各期保持一致；t 为年末，n 为预测年数，r 为对应年折现率。FCFF 为税后企业现金流的一种候选桥接，通常匹配 WACC；FCFE 为股权现金流候选桥接，匹配股权回报率。T 为适用税率，ΔNWC 为经营性营运资金增加额。亏损税盾、实际现金税及物业税前模型需另行定义，不机械套用。期初待投入现金流按时点另列；不得将股权和项目序列混用。"],"requiresDetail":true},{"id":"D02","group":"D","title":"DCF 预测期限与情景","status":"专业待确认","ref":"旧方案期限未在本轮冻结","baseline":"未来预测需要有来源和版本。预测年限、稳定期、逐年预算精度及情景设置尚未完成确认；旧文档中的默认年限不视为已通过专业评审。","definitions":[["显式预测期","逐年或逐期提供现金流的时间段。"],["稳定期与情景","稳定期说明经营何时达到可持续水平；情景分别说明假设，不自动代表概率或综合价值。"]],"focus":"请建议默认期限、可调整范围及适用条件；如使用多个情景，说明假设和输出方式。","example":"","choices":[["fixed","统一默认期限，符合条件时例外调整","请写明年限和例外。"],["asset","按项目生命周期、预算可信度确定期限","请定义可重复执行的规则。"],["other","其他安排","请说明。"]],"requireSource":false,"formula":["期限与时点待专家确认",["年度折现因子 DFt = 1 ÷ (1+r)^t","等月期折现率 rm = (1+r年)^(1/12) − 1"],"年度公式假设年末收支；采用月度、年中或实际日期时应统一时点并修改折现指数。n 不预设为固定年数，各情景独立输出。"],"requiresDetail":true},{"id":"D03","group":"D","title":"DCF 终值与退出费用","status":"专业待确认","ref":"PDF E06","baseline":"终值是预测期之后价值的估计，尚需确定采用方法、收益口径、必要更新需求及退出费用，不自动套用未经确认的默认计算方法。","definitions":[["退出资本化法","用终值时点适用的年度收益与退出资本化率计算期末价值，收益是否扣储备必须明确。"],["永续增长法","基于持续现金流、长期增长与折现假设形成终值，需解释长期可持续性和模型约束。"],["退出净收入","处置费用、税费、未结债务等应按所选项目或股权口径处理，避免重复扣减。"]],"focus":"请给出终值公式、对应年度、费用和时间点；不能只给一个无定义的终值金额。","example":"","choices":[["exitcap","退出资本化法","明确收益口径、退出资本化率及处置费用。"],["growth","永续增长法","明确现金流、长期增长率及折现率。"],["case","按适用条件选择终值方法","需给出选择规则。"],["other","其他方法","请提供公式。"]],"requireSource":false,"formula":["两个候选终值模型，选择及参数待审",["退出资本化法：TVgross,n = Yn+1 ÷ Rexit","永续增长法：TVgross,n = CFn+1 ÷ (r−g)","退出资本化场景：TVnet,n = TVgross,n − 处置费用n − 适用处置税费n"],"Y 为退出时点口径匹配的下一年度收益；Rexit 大于零。CF 为与 r 匹配的可持续现金流；g 为长期增长率，必须 r>g。两种模型择其适用者，不相加。永续持有不自动扣假设出售费用；股权退出按口径扣未偿债务，项目层不扣融资负债，均避免重复。有限土地使用期限及长期更新义务需核定。"],"requiresDetail":true},{"id":"D04","group":"D","title":"EV / EBITDA 倍数法","status":"专业待确认","ref":"Q60 / PDF E04","baseline":"倍数法独立输出。需明确 EBITDA 采用期、倍数来源及企业价值/资产价值/股权价值的桥接，不沿用未经验证的固定倍数区间。","definitions":[["倍数","市场价值或交易价值与对应 EBITDA 的比值；可比对象、期间、规模和经营权利应匹配。"],["桥接","交易是否包含土地、现金、负债、其他业务或控制权因素，决定结果能否直接用于本酒店。"]],"focus":"请说明可用样本、口径调整、剔除规则、净债务桥接；若 EBITDA 非正或数据不可比，如何显示。","example":"","choices":[["conditional","满足可比性和桥接条件时输出","否则显示资料不齐或方法不适用。"],["reference","仅作为辅助参考结果展示","明确局限及价值对象。"],["defer","建议首期暂不输出该方法","须说明恢复使用所需条件。"]],"requireSource":false,"formula":["候选倍数法，专业适用性待审",["EV = 经口径调整的 EBITDA × 可比 EV/EBITDA 倍数"],"EV、EBITDA 使用一致币种，倍数对应相同收益期间、资产和权利范围；不是未经桥接的物业价或股权价。EBITDA 非正或无适用样本时评审不适用状态。"],"requiresDetail":true},{"id":"D05","group":"D","title":"市场比较法与可比案例","status":"专业待确认","ref":"PDF E04、E05","baseline":"有足够适用成交案例时独立计算，不能将挂牌价不加区分地当成交价，也不能只根据同城或同星级认定可比。","definitions":[["比较单元","每间房或每平方米成交价值；应统一面积口径和资产包含范围。"],["可比性调整","基准日、地区、产权、土地、品牌、年代、规模、经营情况及交易条件等因素需有依据。"]],"focus":"请建议案例数量、时间窗口、优先比较单元、调整方法和证据质量；这些阈值由专家建议，不在问卷中预设。","example":"","choices":[["room","以每间房单价为主要比较单元","说明适用酒店及必要调整。"],["area","以可比建筑面积单价为主要比较单元","先统一是否含地下室等口径。"],["both","按条件选择并分别呈现比较单元","不要在无依据时合成。"],["other","其他方法","请说明。"]],"requireSource":false,"formula":["候选比较框架，调整规则待审",["每间房单价 pi = 案例成交金额i ÷ 案例客房数i","调整单价 pi* = pi × Π 各项有依据的调整系数","案例指示价值 Vi = pi* × 目标客房数"],"单位：元/间及元。面积法相应改用成交金额÷可比建筑面积，单位元/平方米。乘法调整仅为候选，不能和百分比加法模型混用；调整方向及多个案例归纳规则由专家确认。案例内部归纳不同于估值方法之间加权；平台仍不合成各方法结果。"],"requiresDetail":true},{"id":"D06","group":"D","title":"成本法与贬值","status":"业务原则已确认，细则待审","ref":"Q53、Q59","baseline":"实际项目投入不等于当前重置成本；成本法独立参考，不构成自动估值下限。土地不能重复加入。","definitions":[["重置成本","基准日重建或取得具有相应效用资产所需的成本概念，不直接等于历史投入。"],["贬值","需考虑实物损耗、功能性和经济性因素；不应把会计折旧余额不加区分地当作全部贬值。"]],"focus":"请说明重置单价、土地取值、成新率及其他贬值的依据；缺少资料时应暂停哪些部分。","example":"投入 1 亿元、收益法 7,000 万元，不因投入较高就把收益法抬高到 1 亿元。","choices":[],"requireSource":false,"formula":["候选成本法分项框架",["Vcost = 土地权益价值 + 建筑物重置成本 + FF&E 重置成本 − 各项适用贬值 + 其他纳入资产净值"],"同一基准日、同币种，各分项不重叠。贬值涵盖适用的实物、功能、经济因素且不重复扣；土地不重复加，建筑物单价如已含设备须拆分。其他资产范围需与价值对象一致。历史投入不作自动下限。"],"requiresDetail":true},{"id":"E01","group":"E","title":"项目 IRR 与股权 IRR","status":"业务原则已确认，细则待审","ref":"Q54","baseline":"IRR 必须使用对应的现金流序列，区分项目整体与业主自有资金回报；不把 NOI 除以自有资金称为 IRR。预测结果明确标注并保留假设。","definitions":[["IRR / XIRR","使所选现金流净现值为零的收益率；不等间隔日期可使用 XIRR。计算周期和年化方式应明确。"],["项目和股权","项目层面的投入/经营/退出现金流与股东出资/分配/退出所得不同，需要各自定义。"]],"focus":"请提供两类现金流桥接，说明追加投入、融资、分红和退出价值；仅有年度 P&L 时还缺少什么。","example":"","choices":[["dated","按实际日期使用 XIRR，预测日期另行明确","输出年化结果，保留原现金流表。"],["periodic","定期间隔 IRR，必要时另外提供 XIRR","需统一周期及年化规则。"],["other","其他定义","请说明。"]],"requireSource":false,"formula":["标准求解框架，现金流范围待核定",["等周期 IRR：0 = Σ[t=0…n] CFt ÷ (1+i)^t","实际日期 XIRR：0 = Σ[k=0…m] CFk ÷ (1+x)^((dk−d0)/365)","月 IRR 年化 = (1+i月)^12 − 1"],"流出为负、流入为正；i 为每期收益率，x 为按 365 天基准计算的年化收益率。项目序列不含融资收支，股权序列反映股东投入与分配；不能重复纳入融资和股东分配。至少有一正一负，但仍可能无解或多解。求解值通常限定大于 −100%。"],"requiresDetail":true},{"id":"E02","group":"E","title":"未退出项目与 IRR 异常","status":"专业待确认","ref":"Q54 / PDF E07","baseline":"资料不足不输出虚假回报率；没有有效解时说明原因。未退出项目的期末价值和多解处理尚需专家定义。","definitions":[["未实现价值","将估计期末价值加入现金流后，结果不再是完全已实现的历史收益率，应明确标识估计部分。"],["多解或无解","现金流形态可能导致没有有效 IRR 或存在多个候选解，不能把求解器返回的任意值直接视为唯一答案。"]],"focus":"请建议未退出酒店的呈现方式和异常判定标准。","example":"","choices":[["separate","区分已实现现金流与含估值的回报分析","未退出部分明确标识假设。"],["forecast","未退出项目仅提供明确标注的预测 IRR","需完整预测序列和期末假设。"],["wait","只在资料足以形成完整闭合现金流时输出","定义何时满足条件。"],["other","其他安排","请说明。"]],"requireSource":false,"formula":["含未实现价值的回报场景",["分析期末现金流 = 当期期内现金流 + 对应价值对象的估计退出净所得"],"仅当期内现金流尚未含退出所得时相加；股权与项目退出口径分别计算。含估计退出所得的 IRR 不是完全已实现回报，必须显示估值日、假设、未实现部分及异常求解状态。"],"requiresDetail":true},{"id":"E03","group":"E","title":"DSCR 的分子口径","status":"专业待确认","ref":"Q55 / PDF E08","baseline":"债务服务覆盖率按同期间收益或可用于偿债的现金流与债务服务金额相除。分子及 FF&E 处理尚待确定，不能直接因为估值采用储备前收益就自动沿用。","definitions":[["DSCR","衡量一定期间偿债覆盖程度的比率；不是贷款余额比率，也不是 IRR。"],["分子一致性","使用 NOI、EBITDA 或可用于偿债现金流时，均须写出具体扣减和调整，不只写缩写。"],["合同口径","若贷款合同另有定义，应保留合同口径与平台分析口径的对应关系。"]],"focus":"请给出标准分子公式、税费/更新支出处理及合同差异展示方式。","example":"","choices":[["standard","平台标准口径与合同口径并列","分别定义，不互相覆盖。"],["contract","优先按有效合同定义计算","无合同定义时说明是否暂停或采用何种参考口径。"],["other","其他安排","请给出公式。"]],"requireSource":false,"formula":["比率框架确认，分子待专家定义",["DSCR = 同期间适用的可偿债收益或现金流 N ÷ 同期间应还本金与应付利息 D"],"单位：倍，D>0。请专家逐项定义 N 的起点、税费、FF&E、CapEx 与营运资金处理，不能自动把资本化的 Y 当 N。示例：N=600 万元，D=400 万元，DSCR=1.50 倍，仅演示除法。D=0 显示不适用，不显示无穷大。"],"requiresDetail":true},{"id":"E04","group":"E","title":"贷款还本付息表与偿债分母","status":"业务已确认","ref":"Q44、Q55","baseline":"首期通过手工或标准 Excel 按贷款、按月采集应还本金与应付利息，并与实付分开。支持多笔贷款、只付息期和到期集中还本。无贷款或当期无偿债义务显示不适用。","definitions":[["应还与实付","应还来自合同和有效还款计划，实付记录履行情况；不能因为未还而把应还分母降为零。"],["历史投入与余额","原贷款投入不等于当前贷款余额，也不能代替本期本金利息义务。"]],"focus":"请补充展期、逾期、提前还款、再融资、费用及跨年到期的处理；历史与预测 DSCR 的期间如何一致？","example":"","choices":[],"requireSource":false,"formula":["已确认分母原则，合同例外待核定",["D年度 = Σ[各贷款、各月]（应还本金 + 应付利息）"],"以有效合同及还款计划为依据，包括到期集中还本，不以实付金额降低应付义务。当前贷款余额不作分母；展期、提前还款、费用或再融资处理须有约定依据。"],"requiresDetail":false},{"id":"F01","group":"F","title":"多种方法并列，不生成综合估值","status":"业务已确认","ref":"Q59-Q60","baseline":"各种方法独立输出结果；不设权重、不取平均、不生成综合估值。成本法不自动托底，IRR/DSCR 不参与估值金额合成。","definitions":[["并列结果","每项结果附方法、对象、期间、参数和主要局限，由读者理解差异。"],["区间与情景","单一方法若呈现情景或区间，仍需说明上下界如何得出，不等同将不同方法结果拼接成统计置信区间。"]],"focus":"请建议各法差异的解释模板，以及是否需要单法情景结果；不能自动生成加权结论。","example":"","choices":[],"requireSource":false,"formula":null,"requiresDetail":false},{"id":"F02","group":"F","title":"资料不齐与方法不适用","status":"业务已确认，状态细分待审","ref":"Q61","baseline":"资料不足的方法显示“资料不齐，待补充”及缺失清单，其他方法正常输出；不以零值或另一方法的结果代替。","definitions":[["资料不足","补充必要输入后可能计算。"],["不适用","即使补齐输入，项目仍不满足某方法前提。"],["计算异常","输入完整但公式或求解未产生有效结果，需有诊断，不能伪装为普通缺失。"]],"focus":"请建议每种方法的必填项、适用条件和状态判定，尤其负 EBITDA、负收益及无 IRR 解。","example":"","choices":[["distinct","区分资料不齐、方法不适用和计算异常","分别给出原因和处理建议。"],["other","其他呈现规则","需保持资料不足的明确提示。"]],"requireSource":false,"formula":null,"requiresDetail":true},{"id":"F03","group":"F","title":"报告资料、假设与修订说明","status":"业务已确认","ref":"Q28-Q29、Q50、Q58、Q62","baseline":"报告应区分原始报表、可比口径转换、估值调整与预测资料，注明采用日期和假设；后续修订须说明变更原因。","definitions":[["可复算","能够依据报告附列的资料、公式和参数，独立复算各方法结果。"],["修订关系","新报告关联旧版本并标明变更范围，保留提供人、时间、原因和来源。"]],"focus":"请指出专业评审和报告必须保留的必要的资料说明，及敏感客户资料应如何脱敏展示。","example":"","choices":[],"requireSource":false,"formula":null,"requiresDetail":false},{"id":"F04","group":"F","title":"估值测算示例与专业复核","status":"专业复核要求待确认","ref":"PDF 第8-9页","baseline":"建议按各估值方法提供一份可独立复算的测算示例，列明酒店条件、基础资料、逐步公式、计算结果和适用限制，供专家核对。","definitions":[["样例覆盖","应覆盖正常经营、一次性调整、更新支出、多笔债务、到期还本、无债务、资料不足及异常收益等。"],["专业定版","确认标准条文、财务口径、计算过程及方法适用边界，列明尚需补充的专业依据。"]],"focus":"请列明可提供的测算示例、需要补充的资料，以及尚不宜采用的估值方法和原因。","example":"","choices":[["samples","按方法提供完整测算示例后确认","标明资料来源、计算过程和金额精度。"],["phased","分方法复核，先确认依据充分的方法","未完成专业复核的方法暂不出具结果。"],["other","其他专业复核安排","请列明可执行要求。"]],"requireSource":false,"formula":null,"requiresDetail":true}]}</script>

<script id="survey-core">
'use strict';
globalThis.AuditCore = (() => {
 const verdicts={agree:'认可所述原则',revise:'建议调整',evidence:'需补充依据',outside:'超出评审范围'};
 const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
 const safeJSON=v=>JSON.stringify(v).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
 const csvCell=v=>{let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s)||/^[\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
 const csv=rows=>'\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');
 const clean=(v,n=12000)=>{if(typeof v!=='string'||v.length>n)throw Error('答卷字段类型或长度不合法');return v};
 function blank(spec,id,now){return {schemaVersion:1,surveyId:spec.id,surveyVersion:spec.version,responseId:id,createdAt:now,updatedAt:now,status:'draft',expert:{name:'',organisation:'',specialty:'',date:''},answers:Object.fromEntries(spec.questions.map(q=>[q.id,{verdict:'',choice:'',note:'',source:''}])),conclusion:'',overallNote:'',attachments:'',confirmed:false};}
 function normalise(raw,spec){
  if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('不是有效答卷对象');
  if(raw.schemaVersion!==1||raw.surveyId!==spec.id||raw.surveyVersion!==spec.version)throw Error('问卷版本或格式不匹配，请使用同一版本');
  if(typeof raw.responseId!=='string'||!/^[a-zA-Z0-9_-]{8,90}$/.test(raw.responseId))throw Error('答卷编号不合法');
  const date=v=>{if(typeof v!=='string'||!/^\d{4}-\d\d-\d\dT/.test(v)||!Number.isFinite(Date.parse(v)))throw Error('答卷时间戳不合法');return v};
  const out=blank(spec,raw.responseId,date(raw.createdAt));out.updatedAt=date(raw.updatedAt);
  if(!['draft','final'].includes(raw.status))throw Error('答卷状态不合法');out.status=raw.status;
  if(!raw.expert||!raw.answers||typeof raw.answers!=='object'||Array.isArray(raw.answers))throw Error('缺少专家信息或答案');
  for(const key of Object.keys(out.expert))out.expert[key]=clean(raw.expert[key]??'',300);
  for(const key of Object.keys(raw.answers))if(!spec.questions.some(q=>q.id===key))throw Error('包含不属于本版本的问题编号');
  for(const q of spec.questions){let a=raw.answers[q.id];if(a==null)continue;if(typeof a!=='object'||Array.isArray(a))throw Error('答案结构错误');
   const v=clean(a.verdict??'',30),ch=clean(a.choice??'',100);if(v&&!Object.hasOwn(verdicts,v))throw Error('存在未知意见选项');
   if(ch&&!q.choices.some(c=>c[0]===ch))throw Error('存在未知专业细则选项');
   out.answers[q.id]={verdict:v,choice:ch,note:clean(a.note??''),source:clean(a.source??'')};
  }
  const conclusions=['','ready','conditional','major','unable'];if(!conclusions.includes(raw.conclusion??''))throw Error('总评选项不合法');
  out.conclusion=raw.conclusion??'';out.overallNote=clean(raw.overallNote??'');out.attachments=clean(raw.attachments??'');out.confirmed=raw.confirmed===true;
  return out;
 }
 function issues(r,spec){const errors=[];const push=(id,message)=>errors.push({id,message});
  if(!r.expert.name.trim())push('expert','请填写专家姓名');
  if(!r.expert.specialty.trim())push('expert','请填写专业领域');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(r.expert.date)||!Number.isFinite(Date.parse(r.expert.date))||new Date(r.expert.date).toISOString().slice(0,10)!==r.expert.date)push('expert','请填写有效评审日期');
  for(const q of spec.questions){const a=r.answers[q.id];if(!a.verdict){push(q.id,q.id+'：请选择评审意见');continue;}
   if(['revise','evidence','outside'].includes(a.verdict)&&!a.note.trim())push(q.id,q.id+'：请说明修改、缺证或范围原因');
   if(['agree','revise'].includes(a.verdict)&&q.choices.length&&!a.choice)push(q.id,q.id+'：请选择建议采用的专业细则');
   if(['agree','revise'].includes(a.verdict)&&a.choice&&q.choices.find(c=>c[0]===a.choice)?.[0]==='other'&&!a.note.trim())push(q.id,q.id+'：请说明其他处理方式');
   if(q.requiresDetail&&a.verdict==='agree'&&!a.note.trim())push(q.id,q.id+'：请补充可执行的专业定义、公式或适用条件');
   if(q.requireSource&&a.verdict==='agree'&&!a.source.trim())push(q.id,q.id+'：认可标准映射时请提供标准条款或映射依据');
  }
  if(!r.conclusion)push('conclusion','请选择总体评审意见');
  if(r.conclusion&&r.conclusion!=='ready'&&!r.overallNote.trim())push('conclusion','请说明总体意见及定版前的条件');
  if(r.conclusion==='ready'&&Object.values(r.answers).some(a=>['revise','evidence'].includes(a.verdict))&&!r.overallNote.trim())push('conclusion','总评可定版但分项有修改或缺证，请解释处理方式');
  if(!r.confirmed)push('conclusion','请勾选末尾的本人填写确认');return errors;
 }
 function parseText(text,spec){if(typeof text!=='string'||text.length>2_500_000)throw Error('文件过大或无效，请使用本问卷导出的答卷');
  let data=text.trim();if(data.startsWith('<')){const m=data.match(/<script\b[^>]*\bid=["']embedded-response["'][^>]*>([\s\S]*?)<\/script\s*>/i);if(!m)throw Error('HTML 中没有答卷数据，请使用“导出”生成的答卷文件');data=m[1];}
  let raw;try{raw=JSON.parse(data)}catch{throw Error('答卷 JSON 无法解析，文件可能损坏')};return normalise(raw,spec);
 }
 function merge(records,incoming){const next=records.slice();let added=0,replaced=0,ignored=0;
  for(const r of incoming){const i=next.findIndex(x=>x.responseId===r.responseId);if(i<0){next.push(r);added++}else if(Date.parse(r.updatedAt)>Date.parse(next[i].updatedAt)){next[i]=r;replaced++}else ignored++;}return {records:next,added,replaced,ignored};}
 function summary(records,spec){return spec.questions.map(q=>{const counts={agree:0,revise:0,evidence:0,outside:0,unanswered:0};const choices={};for(const r of records){const a=r.answers[q.id];counts[a.verdict||'unanswered']++;if(a.choice)choices[a.choice]=(choices[a.choice]||0)+1;}return {id:q.id,counts,choices,disagreement:counts.revise>0||counts.evidence>0||Object.keys(choices).length>1};});}
 return {verdicts,esc,safeJSON,csv,blank,normalise,issues,parseText,merge,summary};
})();
</script>

 }
 function collectorHTML(){const summaries=C.summary(records,S),flags=summaries.filter(x=>x.disagreement).length,complete=records.filter(r=>!C.issues(r,S).length&&r.status==='final').length;
  return `<main class="collector"><section class="panel instructions"><h3>发起人回收台</h3><p class="tiny">让专家发回本问卷导出的 答卷文件 文件，在这里批量导入。数据保存在当前浏览器；请导出汇总备份。同一编号只保留更新时间较新的答卷，不同编号不会因姓名相同而自动合并。</p><div class="actions"><button class="primary" id="collect-files">批量导入专家答卷</button><button id="export-csv" ${records.length?'':'disabled'}>导出逐题汇总 CSV</button><button id="export-bundle" ${records.length?'':'disabled'}>导出回收包 JSON</button><button id="export-summary" ${records.length?'':'disabled'}>导出评审汇总 HTML</button><button class="danger" id="clear-collection" ${records.length?'':'disabled'}>清空本地回收记录</button><input hidden type="file" multiple id="collect-file-input" accept=".json,.html,.htm"></div><details><summary>粘贴专家回传的答卷内容</summary><label class="field">完整答卷文字<textarea id="paste-response" maxlength="2500000" placeholder="粘贴专家复制回传的完整 答卷文件"></textarea></label><button id="import-paste">导入粘贴内容</button></details><p class="tiny muted" id="collection-storage">当前仅在本地整理；无自动收件、邮件发送或上传服务。</p><div id="import-report" hidden></div></section>
  <div class="metrics"><div class="metric"><strong>${records.length}</strong><span>已导入答卷</span></div><div class="metric"><strong>${complete}</strong><span>完整正式答卷</span></div><div class="metric"><strong>${flags}</strong><span>有修改 / 补证 / 细则分歧的问题</span></div></div>
  ${records.length?`<section class="panel"><h3>回收清单</h3><p class="tiny muted">“完整”仅指字段填写通过校验，不代表专家身份认证或专业模型已经通过。</p><div class="tablewrap"><table><thead><tr><th>评审人</th><th>日期 / 更新时间</th><th>状态</th><th>总体意见</th><th>操作</th></tr></thead><tbody>${records.map(r=>{const missing=C.issues(r,S).length;return `<tr><td>${e(r.expert.name||'未署名')}<span class="sub">${e(r.expert.organisation)} · ${e(r.expert.specialty)}</span><span class="sub">${e(r.responseId)}</span></td><td>${e(r.expert.date)}<span class="sub">${e(new Date(r.updatedAt).toLocaleString('zh-CN'))}</span></td><td>${r.status==='final'?'正式':'草稿'}<span class="sub">${missing?'待完善 '+missing+' 项':'填写完整'}</span></td><td>${e(conclusions[r.conclusion]||'未填写')}<details><summary>总评与附件清单</summary><p class="printtext">${e(r.overallNote||'无补充意见')}</p><p class="printtext">${e(r.attachments||'未登记附件')}</p></details></td><td><button data-remove="${e(r.responseId)}" class="tiny danger">移除</button></td></tr>`}).join('')}</tbody></table></div></section>
  <section class="panel"><h3>逐题意见与分歧</h3><p class="tiny muted">“待讨论”是回收提示，不是多数表决结论。请结合来源、专业领域及具体理由复核。</p>${S.questions.map((q,i)=>{const s=summaries[i];return `<details class="collection-q" ${s.disagreement?'open':''}><summary>${q.id} · ${e(q.title)} ${s.disagreement?'<span class="tag alert">待讨论</span>':''}</summary><div>${Object.entries(s.counts).map(([k,n])=>`<span class="tag">${e(C.verdicts[k]||'未作答')} ${n}</span>`).join('')}</div>${records.map(r=>{const a=r.answers[q.id];return `<div class="quote"><h4>${e(r.expert.name||'未署名')} · ${e(C.verdicts[a.verdict]||'未作答')}</h4>${a.choice?`<p>建议细则：${e(q.choices.find(ch=>ch[0]===a.choice)?.[1])}</p>`:''}<p>${e(a.note||'未附文字意见')}</p>${a.source?`<p class="muted">依据：${e(a.source)}</p>`:''}</div>`}).join('')}</details>`}).join('')}</section>`:'<div class="empty"><h3>等待第一份专家答卷</h3><p>支持多选文件导入；同一份答卷的 不同格式 不会重复计数。</p></div>'}</main>`;
 }
 async function readFile(f){if(f.size>2_500_000)throw Error(f.name+'：文件超过 2.5 MB');return C.parseText(await f.text(),S)}
 async function readCollectionFile(f){if(f.size>25_000_000)throw Error('回收文件过大');const text=await f.text();if(text.trim().startsWith('{')){let raw;try{raw=JSON.parse(text)}catch{}if(raw?.kind==='pamcap-collection'){if(raw.surveyId!==S.id||raw.surveyVersion!==S.version||!Array.isArray(raw.responses)||raw.responses.length>300)throw Error('回收包版本或结构不正确');return raw.responses.map(x=>C.normalise(x,S));}}return [C.parseText(text,S)];}
 function persistCollection(){const ok=localSet(collectionKey,JSON.stringify(records));if(!ok)toast('浏览器回收暂存不可用，请立即导出回收包 JSON。');return ok;}
 function bindCollection(){
 $('import-paste').onclick=()=>{try{const incoming=C.parseText($('paste-response').value,S);const merged=C.merge(records,[incoming]);if(merged.records.length>300)throw Error('本地最多保留 300 份答卷');records=merged.records;persistCollection();render();toast('导入完成：新增 '+merged.added+'，更新 '+merged.replaced+'，忽略重复 '+merged.ignored);}catch(err){toast(err.message)}};

  $('collect-files').onclick=()=>$('collect-file-input').click();$('collect-file-input').onchange=async ev=>{const files=[...ev.target.files],incoming=[],errors=[];if(files.length>100){toast('单次最多导入 100 个文件。');return;}
   for(const f of files){try{incoming.push(...await readCollectionFile(f))}catch(err){errors.push(f.name+'：'+err.message)}}
   const merged=C.merge(records,incoming);if(merged.records.length>300){toast('本地最多保留 300 份答卷，请分批汇总。');return;}records=merged.records;const saved=persistCollection();render();const report=$('import-report');report.hidden=false;report.className='banner';report.innerHTML=`新增 ${merged.added} 份，更新 ${merged.replaced} 份，忽略重复或较旧版本 ${merged.ignored} 份。${saved?'':' 浏览器存储不可用，请导出回收包。'}${errors.length?'<p>以下文件未导入：</p><ul>'+errors.map(x=>'<li>'+e(x)+'</li>').join('')+'</ul>':''}`;toast(errors.length?'部分文件未导入，请查看结果。':'导入完成。');};
  $('export-csv').onclick=()=>{const rows=[['问卷版本','答卷编号','专家姓名','机构','专业领域','评审日期','答卷状态','更新时间','问题编号','题目','评审意见','建议细则','文字意见','依据','总体结论','总体意见','附件清单']];for(const r of records)for(const q of S.questions){const a=r.answers[q.id];rows.push([S.version,r.responseId,r.expert.name,r.expert.organisation,r.expert.specialty,r.expert.date,r.status,r.updatedAt,q.id,q.title,C.verdicts[a.verdict]||'未作答',q.choices.find(c=>c[0]===a.choice)?.[1]||'',a.note,a.source,conclusions[r.conclusion]||'',r.overallNote,r.attachments]);}download(C.csv(rows),'螃蟹树聚_估值专家问卷_逐题回收汇总.csv','text/csv;charset=utf-8');toast('已导出逐题汇总，可用 Excel 打开。')};
  $('export-bundle').onclick=()=>download(JSON.stringify({kind:'pamcap-collection',surveyId:S.id,surveyVersion:S.version,exportedAt:now(),responses:records},null,2),'螃蟹树聚_估值专家问卷_回收包.json','application/json;charset=utf-8');
  $('export-summary').onclick=()=>download(summaryDocument(),'螃蟹树聚_估值专家问卷_评审意见汇总.html','text/html;charset=utf-8');
  $('clear-collection').onclick=()=>{if(!confirm('将清空此浏览器内的全部回收记录。请先导出回收包备份。是否继续？'))return;records=[];persistCollection();render();toast('本地回收记录已清空。')};
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(!confirm('从本地回收清单移除此答卷？原始文件不会被删除。'))return;records=records.filter(r=>r.responseId!==b.dataset.remove);persistCollection();render()});
 }
 function responseSummary(r){return `<h1>酒店资产估值 · 专家评审答卷</h1><p>版本 V${S.version} · ${e(r.status==='final'?'正式答卷':'草稿')} · 编号 ${e(r.responseId)}</p><p>专家：${e(r.expert.name)}　机构：${e(r.expert.organisation)}　专业：${e(r.expert.specialty)}　日期：${e(r.expert.date)}</p>${S.questions.map(q=>{const a=r.answers[q.id];return `<section class="answer-snapshot"><h3>${q.id} · ${e(q.title)}</h3><p>评审规则：${e(q.baseline)}</p>${q.formula?`<p>公式：${q.formula[1].map(e).join('；')}</p><p>${e(q.formula[2])}</p>`:''}<p>意见：${e(C.verdicts[a.verdict]||'未作答')}</p>${a.choice?`<p>建议细则：${e(q.choices.find(c=>c[0]===a.choice)?.[1]||'')}</p>`:''}<p>文字意见：${e(a.note||'无')}</p><p>依据：${e(a.source||'未填写')}</p></section>`}).join('')}<h2>总体意见</h2><p>${e(conclusions[r.conclusion]||'未填写')}</p><p>${e(r.overallNote)}</p><p>附件清单：${e(r.attachments||'未登记')}</p><p>本人填写确认：${r.confirmed?'已勾选':'未勾选'}</p>`;}
 function summaryDocument(){const stats=C.summary(records,S);return `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>螃蟹树聚 · 专家评审回收汇总</title><style>body{font:15px/1.75 -apple-system,"Microsoft YaHei",sans-serif;color:#203744;max-width:1000px;margin:40px auto;padding:0 24px}h1,h2{color:#096e68}section{border-top:1px solid #ccdcd3;margin-top:24px;padding-top:14px}article{padding:12px 16px;background:#f3f7f4;margin:12px 0}p{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#617984}@media print{article{break-inside:avoid}}</style><h1>酒店资产估值 · 专家评审回收汇总</h1><p>问卷 V${S.version} · ${records.length} 份答卷 · 导出时间 ${e(new Date().toLocaleString('zh-CN'))}</p><p>本文件为意见整理，不自动合成专家结论；原始答卷请另行保留。完整性校验不等于专业通过。</p><h2>总体意见与附件</h2>${records.map(r=>`<article><h3>${e(r.expert.name||'未署名')} · ${e(r.expert.specialty)}</h3><small>${e(r.expert.organisation)} / ${e(r.expert.date)} / ${e(r.status)} / ${C.issues(r,S).length?'待完善':'填写完整'} / ${e(r.responseId)}</small><p>${e(conclusions[r.conclusion]||'未填写总评')}</p><p>${e(r.overallNote||'无补充')}</p><p>附件：${e(r.attachments||'未登记')}</p></article>`).join('')}<h2>逐题评审</h2>${S.questions.map((q,i)=>`<section><h3>${q.id} · ${e(q.title)}</h3><p>评审规则：${e(q.baseline)}</p><small>${Object.entries(stats[i].counts).map(([k,n])=>e(C.verdicts[k]||'未作答')+' '+n).join(' / ')}</small>${records.map(r=>{const a=r.answers[q.id];return `<article><b>${e(r.expert.name||'未署名')} · ${e(C.verdicts[a.verdict]||'未作答')}</b><p>细则：${e(q.choices.find(c=>c[0]===a.choice)?.[1]||'未选择')}</p><p>${e(a.note||'未附文字意见')}</p><p>依据：${e(a.source||'未填写')}</p></article>`}).join('')}</section>`).join('')}</html>`;}
 window.addEventListener('beforeprint',()=>{$('print-root').innerHTML=view==='survey'?responseSummary(state):'<h1>请使用“导出评审汇总 HTML”后打印汇总文件</h1>';});window.addEventListener('afterprint',()=>$('print-root').replaceChildren());
 render();if(initMessage)toast(initMessage);if(!storageOK)toast('当前浏览器可能无法暂存，请及时导出文件。');
})();
</script>
</body>
</html>
